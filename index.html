<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Live Scanner Kunci ATM</title>
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020617;color:#fff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;min-height:100vh}header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:#0f172a;border-bottom:1px solid #334155;position:sticky;top:0;z-index:5}h1{font-size:16px;margin:0}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer}#closeBtn{background:#fee2e2;color:#991b1b}main{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px}.camera{position:relative;flex:1;min-height:62vh;background:#000;border-radius:18px;overflow:hidden;border:1px solid #334155}.camera video{width:100%;height:100%;min-height:62vh;object-fit:cover;display:block}.frame{position:absolute;left:50%;top:50%;width:min(76vw,310px);aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.34);pointer-events:none}.frame:before,.frame:after{content:'';position:absolute;left:10%;right:10%;height:2px;background:#22c55e;top:50%;box-shadow:0 0 10px rgba(34,197,94,.8)}.frame:after{display:none}.status{background:rgba(15,23,42,.86);padding:10px 12px;border-radius:12px;text-align:center;font-size:12px}.ok{color:#86efac}.err{color:#fda4af}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}#switchBtn{background:#e2e8f0;color:#0f172a}#stopBtn{background:#fee2e2;color:#991b1b}.hint{text-align:center;font-size:12px;color:#cbd5e1;line-height:1.45;padding:0 10px 8px}@media(min-width:700px){main{max-width:520px;width:100%;margin:0 auto}.camera{min-height:600px}.camera video{min-height:600px}}
  </style>
</head>
<body>
<header><h1>📷 Live Scanner ATM</h1><button id="closeBtn" type="button">Tutup</button></header>
<main>
  <div id="status" class="status">Menyiapkan kamera...</div>
  <div class="camera"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div>
  <div class="actions"><button id="switchBtn" type="button">🔄 Ganti Kamera</button><button id="stopBtn" type="button">⏹ Hentikan</button></div>
  <div class="hint">Arahkan barcode ke dalam kotak. ZXing akan membaca barcode secara realtime. Setelah terbaca, hasil dikirim kembali ke aplikasi.</div>
</main>
<script>
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
let reader=null, controls=null, devices=[], index=0, running=false;
function setStatus(text, cls=''){statusEl.textContent=text;statusEl.className='status '+cls}
async function start(){
  if(!window.ZXingBrowser||!ZXingBrowser.BrowserMultiFormatReader){setStatus('ZXing gagal dimuat. Periksa internet.','err');return}
  try{
    devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    if(!devices.length) throw new Error('Kamera tidak ditemukan.');
    const back=devices.findIndex(d=>/back|rear|environment|belakang/i.test(d.label));
    if(index===0&&back>=0) index=back;
    const deviceId=devices[index]?.deviceId;
    reader=new ZXingBrowser.BrowserMultiFormatReader();
    setStatus('Meminta izin kamera...');
    controls=await reader.decodeFromVideoDevice(deviceId,video,(result,error)=>{
      if(result){
        const code=result.getText().trim();
        if(code) sendCode(code);
      }
    });
    running=true;setStatus('Kamera aktif — arahkan barcode ke kotak','ok');
  }catch(e){running=false;setStatus('Kamera gagal: '+(e.message||e),'err')}
}
function sendCode(code){
  try{window.opener?.postMessage({type:'ATM_BARCODE_SCANNED',code},'*')}catch(e){window.opener?.postMessage({type:'ATM_BARCODE_SCANNED',code},'*')}
  stop(false);setStatus('Barcode terbaca: '+code,'ok');setTimeout(()=>{try{window.close()}catch(e){}},350)
}
function stop(close=true){try{controls?.stop()}catch(e){}try{reader?.reset()}catch(e){}controls=null;reader=null;running=false;if(close){setStatus('Scanner dihentikan');}}
document.getElementById('switchBtn').onclick=async()=>{if(!devices.length)return;stop(false);index=(index+1)%devices.length;await start()};
document.getElementById('stopBtn').onclick=()=>{stop(true);try{window.opener?.postMessage({type:'ATM_SCANNER_STOPPED'},'*')}catch(e){}};
document.getElementById('closeBtn').onclick=()=>{stop(false);window.close()};
window.addEventListener('message',e=>{if(e.data?.type==='STOP_ATM_SCANNER')stop(true)});
start();
</script>
</body>
</html>
